<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hero 3D Book Test Runner</title>
</head>
<body>
  <div id="test-container" style="width: 480px; height: 320px;">
    <canvas id="hero-3d-canvas" style="width: 100%; height: 100%;"></canvas>
    <div class="hero-fallback-img" style="display: none;">Fallback Image</div>
  </div>
  <div id="test-results"></div>

  <!-- Local vendor scripts for standalone testing -->
  <script src="vendor/three.min.js"></script>
  <script src="hero-3d.js"></script>

  <script>
    const results = [];
    function assert(name, condition, details = '') {
      results.push({ name, passed: !!condition, details });
      console.log((condition ? 'PASS: ' : 'FAIL: ') + name + (details ? ' (' + details + ')' : ''));
    }

    async function runTests() {
      // Test 1: Three.js r128 loaded and exposed
      assert('Three.js global loaded', typeof THREE !== 'undefined' && THREE.REVISION === '128', 'THREE.REVISION = ' + (typeof THREE !== 'undefined' ? THREE.REVISION : 'undefined'));

      // Test 2: Hero3DBook module export
      assert('Hero3DBook module exists', typeof Hero3DBook !== 'undefined' && typeof Hero3DBook.init === 'function');
      assert('initHero3DBook helper exists', typeof initHero3DBook === 'function');

      // Test 3: WebGL detection function
      const webglSupported = Hero3DBook.isWebGLSupported();
      assert('isWebGLSupported returns boolean', typeof webglSupported === 'boolean', 'webglSupported = ' + webglSupported);

      // Test 4: Initialize 3D Book Experience
      const canvas = document.getElementById('hero-3d-canvas');
      const bookExp = initHero3DBook('#hero-3d-canvas');
      assert('Book instance created', !!bookExp && typeof bookExp.start === 'function' && typeof bookExp.destroy === 'function');

      if (webglSupported) {
        assert('Scene initialized', !!bookExp.scene);
        assert('Camera initialized', !!bookExp.camera);
        assert('Renderer initialized', !!bookExp.renderer);
        assert('Book group added to scene', !!bookExp.bookGroup && bookExp.bookGroup.children.length >= 4);

        // Test 5: Meshes & Geometries
        assert('Textures generated', Array.isArray(bookExp.textures) && bookExp.textures.length >= 4);
        assert('Materials generated', Array.isArray(bookExp.materials) && bookExp.materials.length >= 5);
        assert('Geometries created', Array.isArray(bookExp.geometries) && bookExp.geometries.length >= 5);

        // Test 6: Running state & loop
        assert('Animation running state is true', bookExp.isRunning === true);

        // Test 7: Floating / Breathing update tick
        const initialY = bookExp.bookGroup.position.y;
        bookExp._update();
        assert('Update cycle executes without error', true);

        // Test 8: Parallax tilt interaction
        const prevTiltY = bookExp.targetTiltY;
        bookExp._handlePointerMove({ clientX: 200, clientY: 100 });
        assert('Pointer move updates target tilt', bookExp.targetTiltX !== 0 || bookExp.targetTiltY !== 0);
        bookExp._update();
        assert('Tilt interpolates smoothly towards target', bookExp.currentTiltX !== 0 || bookExp.currentTiltY !== 0);

        bookExp._handlePointerLeave();
        assert('Pointer leave resets target tilt to zero', bookExp.targetTiltX === 0 && bookExp.targetTiltY === 0);

        // Test 9: prefers-reduced-motion support
        bookExp._handleMotionPreferenceChange({ matches: true });
        assert('Reduced motion sets isReducedMotion = true', bookExp.isReducedMotion === true);
        bookExp._update();
        assert('Reduced motion resets Y translation to 0', bookExp.bookGroup.position.y === 0);
        assert('Reduced motion sets base rotation X', bookExp.bookGroup.rotation.x === bookExp.options.baseRotationX);

        bookExp._handleMotionPreferenceChange({ matches: false });
        assert('Restoring motion sets isReducedMotion = false', bookExp.isReducedMotion === false);

        // Test 10: IntersectionObserver lifecycle (stop/start)
        bookExp.stop();
        assert('stop() stops rAF loop', bookExp.isRunning === false && bookExp.animId === null);
        bookExp.start();
        assert('start() restarts rAF loop', bookExp.isRunning === true && bookExp.animId !== null);

        // Test 11: Cleanup & destruction
        bookExp.destroy();
        assert('destroy() cleans up observer and stops loop', bookExp.isRunning === false && bookExp.observer === null);
      } else {
        // Fallback testing
        assert('Fallback displayed when WebGL unsupported', canvas.style.display === 'none');
      }

      // Test 12: Graceful error handling with invalid canvas selector
      let errorHandledGracefully = false;
      try {
        const invalidExp = initHero3DBook('#nonexistent-canvas');
        errorHandledGracefully = true;
      } catch (e) {
        errorHandledGracefully = false;
      }
      assert('Invalid canvas selector handled gracefully', errorHandledGracefully);

      // Render summary into DOM
      const summaryDiv = document.getElementById('test-results');
      const allPassed = results.every(r => r.passed);
      summaryDiv.setAttribute('data-status', allPassed ? 'PASSED' : 'FAILED');
      summaryDiv.innerHTML = '<h1>Tests ' + (allPassed ? 'ALL PASSED' : 'SOME FAILED') + '</h1>' +
        '<ul>' + results.map(r => '<li class="' + (r.passed ? 'pass' : 'fail') + '">' +
          (r.passed ? '✅ ' : '❌ ') + r.name + (r.details ? ': ' + r.details : '') +
        '</li>').join('') + '</ul>';
    }

    window.addEventListener('DOMContentLoaded', runTests);
  </script>
</body>
</html>
