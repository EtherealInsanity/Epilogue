name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach APKs to (e.g. v2.0.5). Leave empty for latest release.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Setup Android Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD" > android/key.properties
            echo "keyPassword=$ANDROID_KEY_PASSWORD" >> android/key.properties
            echo "keyAlias=$ANDROID_KEY_ALIAS" >> android/key.properties
            echo "storeFile=upload-keystore.jks" >> android/key.properties
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Determine Target Release Version
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          fi
          if [ -z "$TAG" ]; then
            PUBSPEC_VER=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
            TAG="v${PUBSPEC_VER}"
          fi
          echo "Target release tag: $TAG"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build Universal APK
        run: |
          flutter build apk --release --android-skip-build-dependency-validation
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/Epilogue-${{ steps.version.outputs.tag }}-android-universal.apk"

      - name: Build Split-per-ABI APKs (arm64-v8a, armeabi-v7a, x86_64)
        run: |
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          mkdir -p dist
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
               "dist/Epilogue-${{ steps.version.outputs.tag }}-android-arm64-v8a.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" \
               "dist/Epilogue-${{ steps.version.outputs.tag }}-android-armeabi-v7a.apk"
          fi
          if [ -f "build/app/outputs/flutter-apk/app-x86_64-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-x86_64-release.apk" \
               "dist/Epilogue-${{ steps.version.outputs.tag }}-android-x86_64.apk"
          fi

      - name: List Generated APKs
        run: ls -lh dist/

      - name: Upload APKs as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Epilogue-${{ steps.version.outputs.tag }}-android-apks
          path: dist/*
          if-no-files-found: error

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: ${{ steps.version.outputs.tag != '' }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: dist/*
        continue-on-error: true
