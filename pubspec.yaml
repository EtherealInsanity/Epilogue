name: epilogue
description: "Epilogue - Immersive EPUB & Web Novel Reader for Android with Star Stream Progression"
publish_to: 'none'
version: 2.0.3+203

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  # Fast EPUB unpacking & chapter extraction
  epubx: ^4.0.0
  # Direct byte-exact EPUB packaging
  archive: ^3.6.1
  # Local persistence for bookmarks, reading progress & preferences
  shared_preferences: ^2.5.3
  # File path utilities & documents directory
  path_provider: ^2.1.5
  # Native directory & file picker for library selection
  file_picker: ^8.1.7
  # Optional rich HTML styling when EPUB formatting toggle is enabled
  flutter_html: ^3.0.0-beta.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  shaders:
    - shaders/crt.frag
